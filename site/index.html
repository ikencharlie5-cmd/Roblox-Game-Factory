<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chiken Studios — Game Factory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f17; --panel: #151926; --panel2: #1c2133; --line: #2a3150;
    --text: #e8ebf5; --dim: #8b93b0;
    --ideas: #ffb02e; --rnd: #2dd4bf; --audio: #f472b6; --animation: #fb7185; --gameplay: #4ade80; --graphics: #38bdf8; --ui: #c084fc;
    --manager: #f87171; --checker: #facc15; --charlie: #fb923c; --done: #34d399; --system: #64748b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 Inter, system-ui, sans-serif;
    background-image: radial-gradient(circle at 20% 0%, #1b2140 0, transparent 45%), radial-gradient(circle at 90% 30%, #2a1630 0, transparent 40%); min-height: 100vh; }
  header { display: flex; align-items: center; gap: 16px; padding: 18px 28px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .logo { font-family: Fredoka; font-size: 26px; font-weight: 700; letter-spacing: .3px; }
  .logo span { color: var(--ideas); }
  .sub { color: var(--dim); font-size: 13px; }
  .spacer { flex: 1; }
  .btn { font: 600 14px Fredoka; padding: 10px 16px; border-radius: 12px; border: 0; cursor: pointer; text-decoration: none;
    color: #111; background: var(--ideas); display: inline-flex; gap: 8px; align-items: center; transition: transform .1s; }
  .btn:hover { transform: translateY(-1px); }
  .btn.ghost { background: var(--panel2); color: var(--text); border: 1px solid var(--line); }
  main { display: grid; grid-template-columns: 240px 1fr 360px; gap: 18px; padding: 18px 28px 40px; }
  @media (max-width: 1150px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
  h2 { font: 600 15px Fredoka; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); margin: 0 0 12px; }
  .games { display: flex; flex-direction: column; gap: 8px; }
  .game { padding: 12px; border-radius: 12px; background: var(--panel2); border: 1px solid transparent; cursor: pointer; }
  .game.sel { border-color: var(--ideas); }
  .game b { font-family: Fredoka; font-size: 16px; display: block; }
  .pill { display: inline-block; font: 600 11px Inter; padding: 2px 8px; border-radius: 99px; text-transform: uppercase; letter-spacing: .5px; }
  .empty { color: var(--dim); font-size: 14px; }
  #map svg { width: 100%; height: auto; display: block; }
  .node { cursor: pointer; }
  .node rect { fill: var(--panel2); stroke: var(--line); stroke-width: 2; transition: all .2s; }
  .node:hover rect { fill: #242a40; }
  .node text { font-family: Fredoka; fill: var(--text); pointer-events: none; }
  .node .role { font-size: 17px; font-weight: 600; }
  .node .state { font-size: 12px; fill: var(--dim); font-family: Inter; }
  .node.active rect { stroke-width: 3; animation: pulse 1.6s ease-in-out infinite; }
  .node.sel rect { fill: #262d47; }
  @keyframes pulse { 50% { stroke-opacity: .35; } }
  .edge { fill: none; stroke: #39416a; stroke-width: 2.5; }
  .edge.loop { stroke-dasharray: 6 6; }
  .edge.hot { stroke: var(--ideas); animation: flow 1s linear infinite; stroke-dasharray: 8 6; }
  @keyframes flow { to { stroke-dashoffset: -28; } }
  .type { animation: tap .22s ease-in-out infinite alternate; }
  .type2 { animation: tap .22s ease-in-out infinite alternate-reverse; }
  @keyframes tap { to { transform: rotate(-14deg); } }
  .flick { animation: neonflick 4s infinite; }
  @keyframes neonflick { 0%,18%,22%,60%,100% { opacity: 1; } 20% { opacity: .55; } 62% { opacity: .8; } }
  @keyframes bob { to { transform: translateY(-3px) rotate(-3deg); } }
  .glow { animation: flick 2.2s ease-in-out infinite; }
  @keyframes flick { 50% { opacity: .05; } }
  .elev { transition: transform 1.4s cubic-bezier(.5,0,.3,1); }
  .room:hover rect:first-child { filter: brightness(1.12); }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .tab { font: 600 13px Fredoka; padding: 6px 12px; border-radius: 10px; background: var(--panel2); color: var(--dim); border: 0; cursor: pointer; }
  .tab.on { color: #111; }
  .doc { background: var(--bg); border-radius: 12px; padding: 14px 18px; max-height: 520px; overflow: auto; font-size: 14px; }
  .doc h1, .doc h2, .doc h3 { font-family: Fredoka; color: var(--text); text-transform: none; letter-spacing: 0; }
  .doc h1 { font-size: 22px; } .doc h2 { font-size: 18px; margin-top: 18px; } .doc h3 { font-size: 15px; }
  .doc code { font-family: 'JetBrains Mono'; background: var(--panel2); padding: 1px 5px; border-radius: 5px; font-size: 12.5px; }
  .doc pre { background: var(--panel2); padding: 10px; border-radius: 8px; overflow: auto; }
  .doc pre code { background: none; padding: 0; }
  .doc table { border-collapse: collapse; width: 100%; } .doc td, .doc th { border: 1px solid var(--line); padding: 6px 8px; text-align: left; }
  .feed { display: flex; flex-direction: column; gap: 10px; max-height: 560px; overflow: auto; }
  .msg { background: var(--panel2); border-radius: 12px; padding: 10px 12px; border-left: 4px solid var(--system); }
  .msg .who { font: 600 12px Fredoka; text-transform: uppercase; letter-spacing: .5px; }
  .msg .t { color: var(--dim); font-size: 11px; float: right; }
  .msg p { margin: 4px 0 0; font-size: 14px; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .inspo { background: var(--panel2); border-radius: 12px; overflow: hidden; font-size: 12px; }
  .inspo img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; cursor: zoom-in; }
  .inspo .cap { padding: 6px 8px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .inspo pre { margin: 0; padding: 8px; font-size: 11px; white-space: pre-wrap; max-height: 105px; overflow: hidden; color: var(--text); }
  .stack { display: flex; flex-direction: column; gap: 18px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #modal { position: fixed; inset: 0; background: #000c; display: none; align-items: center; justify-content: center; z-index: 9; padding: 20px; }
  #modal.on { display: flex; }
  #modal .box { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 24px; max-width: 560px; }
  #modal img { max-width: 92vw; max-height: 88vh; border-radius: 12px; }
  #modal code { font-family: 'JetBrains Mono'; background: var(--bg); padding: 3px 8px; border-radius: 6px; }
  .updated { font-size: 12px; color: var(--dim); }
</style>
</head>
<body>
<header>
  <div>
    <div class="logo">🐔 Chiken <span>Studios</span></div>
    <div class="sub">Game Factory HQ — live from the office</div>
  </div>
  <div class="spacer"></div>
  <span class="updated" id="updated"></span>
  <a class="btn ghost" id="uploadGlobal" target="_blank">📎 Upload inspiration</a>
  <button class="btn" onclick="showNew()">＋ New game idea</button>
</header>

<main>
  <aside class="card">
    <h2>Games</h2>
    <div class="games" id="games"></div>
  </aside>

  <section class="stack">
    <div class="card" id="map"></div>
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <h2 id="panelTitle">Team member</h2>
      </div>
      <div class="tabs" id="panelTabs"></div>
      <div class="doc" id="panelDoc"></div>
    </div>
    <div class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:12px">
        <h2 style="margin:0">Inspiration board</h2>
        <a class="btn ghost" id="uploadGame" target="_blank">📎 Upload for this game</a>
      </div>
      <div class="gallery" id="gallery"></div>
    </div>
  </section>

  <aside class="card">
    <h2>Office chat</h2>
    <div class="feed" id="feed"></div>
  </aside>
</main>

<div id="modal" onclick="if(event.target===this)this.classList.remove('on')"><div id="modalBody"></div></div>

<script>
const REPO = "ikencharlie5-cmd/Roblox-Game-Factory";
const ROLES = {
  charlie:  { label: "Charlie",   icon: "👑", color: "var(--charlie)" },
  rnd:      { label: "R&D",       icon: "🔬", color: "var(--rnd)" },
  ideas:    { label: "Ideas",     icon: "💡", color: "var(--ideas)" },
  gameplay: { label: "Gameplay",  icon: "⚙️", color: "var(--gameplay)" },
  graphics: { label: "Graphics",  icon: "🎨", color: "var(--graphics)" },
  ui:       { label: "UI",        icon: "🖥️", color: "var(--ui)" },
  audio:    { label: "Audio",     icon: "🎵", color: "var(--audio)" },
  animation:{ label: "Animation", icon: "🎬", color: "var(--animation)" },
  manager:  { label: "Manager",   icon: "🧑‍💼", color: "var(--manager)" },
  checker:  { label: "Checker",   icon: "🔍", color: "var(--checker)" },
  done:     { label: "Shipped",   icon: "🚀", color: "var(--done)" },
  system:   { label: "Pipeline",  icon: "•",  color: "var(--system)" },
  all:      { label: "Everyone",  icon: "",   color: "var(--dim)" },
};
const STAGES = ["research", "ideas", "approval", "branches", "manager", "checker", "signoff", "done"];
const STAGE_LABEL = { research: "Researching", ideas: "Designing", approval: "Waiting for Charlie", branches: "Building", manager: "Manager deciding", checker: "Checking", signoff: "Manager sign-off", done: "Shipped" };
const BRANCH_COLOR = { waiting: "#64748b", working: "#ffb02e", blocked: "#f87171", done: "#34d399" };

let DATA = { games: [], inspiration: [] };
let selGame = null, selNode = "ideas", selTab = null;

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function md(src) {
  if (!src) return '<p class="empty">Nothing here yet.</p>';
  const lines = src.replace(/\r/g, "").split("\n");
  let out = "", inList = false, inCode = false, table = [];
  const inline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" style="color:var(--graphics)">$1</a>');
  const flushTable = () => {
    if (!table.length) return;
    const rows = table.filter(r => !/^\|[\s:|-]+\|$/.test(r.trim()));
    out += "<table>" + rows.map((r, i) => "<tr>" + r.trim().replace(/^\||\|$/g, "").split("|")
      .map(c => i ? `<td>${inline(c.trim())}</td>` : `<th>${inline(c.trim())}</th>`).join("") + "</tr>").join("") + "</table>";
    table = [];
  };
  for (const l of lines) {
    if (l.startsWith("```")) { if (inList) { out += "</ul>"; inList = false; } out += inCode ? "</code></pre>" : "<pre><code>"; inCode = !inCode; continue; }
    if (inCode) { out += esc(l) + "\n"; continue; }
    if (l.trim().startsWith("|")) { table.push(l); continue; } else flushTable();
    const li = l.match(/^\s*[-*]\s+(.*)/) || l.match(/^\s*\d+\.\s+(.*)/);
    if (li) { if (!inList) { out += "<ul>"; inList = true; } out += `<li>${inline(li[1].replace(/^\[ \]/, "☐").replace(/^\[x\]/i, "☑"))}</li>`; continue; }
    if (inList) { out += "</ul>"; inList = false; }
    const h = l.match(/^(#{1,3})\s+(.*)/);
    if (h) { out += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; continue; }
    if (l.trim()) out += `<p>${inline(l)}</p>`;
  }
  flushTable(); if (inList) out += "</ul>";
  return out;
}

const ago = t => {
  if (!t) return "";
  const s = (Date.now() - new Date(t)) / 1000;
  return s < 60 ? "just now" : s < 3600 ? Math.floor(s / 60) + "m ago" : s < 86400 ? Math.floor(s / 3600) + "h ago" : Math.floor(s / 86400) + "d ago";
};

function renderGames() {
  const el = document.getElementById("games");
  if (!DATA.games.length) { el.innerHTML = '<p class="empty">No games yet. Hit <b>＋ New game idea</b> to start one.</p>'; return; }
  el.innerHTML = DATA.games.map(g => {
    const st = g.stage === "signoff" ? "manager" : g.stage === "research" ? "rnd" : g.stage === "done" ? "done" : g.stage === "approval" ? "charlie" : g.stage === "branches" ? "gameplay" : g.stage;
    return `<div class="game ${selGame?.slug === g.slug ? "sel" : ""}" onclick="pick('${g.slug}')">
      <b>${esc(g.name)}</b>
      <span class="pill" style="background:${ROLES[st]?.color || "var(--dim)"};color:#111">${STAGE_LABEL[g.stage] || g.stage}</span>
      <div class="sub" style="margin-top:4px">${ago(g.updated)}</div></div>`;
  }).join("");
}

function nodeState(id, g) {
  if (!g) return { text: "idle", active: false, color: null };
  const si = STAGES.indexOf(g.stage);
  if (["gameplay", "graphics", "ui", "audio", "animation"].includes(id)) {
    const s = g.branches?.[id] || "waiting";
    return { text: s, active: g.stage === "branches" && s === "working", color: BRANCH_COLOR[s] };
  }
  const own = { rnd: "research", ideas: "ideas", charlie: "approval", manager: "manager", checker: "checker", done: "done" }[id];
  if (id === "inspiration") return { text: `${(g.inspiration?.length || 0) + DATA.inspiration.length} files`, active: false, color: null };
  if (id === "manager" && g.stage === "signoff") return { text: "final sign-off", active: true, color: ROLES.manager.color };
  if (g.stage === own) return { text: id === "done" ? "shipped! 🎉" : "working now", active: id !== "done", color: ROLES[id].color };
  if (si > STAGES.indexOf(own)) return { text: "✓ done", active: false, color: "#34d399" };
  return { text: "waiting", active: false, color: null };
}

function lastMsg(g, role) {
  const log = g?.log || [];
  for (let i = log.length - 1; i >= 0; i--) if (log[i].from === role) return log[i].text;
  return "";
}
const STAGE_FLOOR = { research: 4, ideas: 3, approval: 3, branches: 2, manager: 5, checker: 5, signoff: 5, done: 1 };
const NEON = { manager: "#ff4d6d", checker: "#ffe14d", rnd: "#2de2e6", ideas: "#ffb02e", charlie: "#ff8a3d",
  gameplay: "#39ff88", graphics: "#3db8ff", ui: "#c77dff", audio: "#ff5ec8", animation: "#ff6b8a",
  inspiration: "#9aa8ff", done: "#39ffb6" };

function stick(cx, baseY, color, on) {
  // stick figure sitting at a desk, typing when on
  return `<g stroke="${color}" stroke-width="2.4" stroke-linecap="round" fill="none" filter="url(#neon)">
    <circle cx="${cx}" cy="${baseY - 30}" r="6"/>
    <line x1="${cx}" y1="${baseY - 24}" x2="${cx}" y2="${baseY - 8}"/>
    <line x1="${cx}" y1="${baseY - 8}" x2="${cx + 9}" y2="${baseY - 8}"/>
    <line x1="${cx + 9}" y1="${baseY - 8}" x2="${cx + 9}" y2="${baseY + 4}"/>
    <g class="${on ? "type" : ""}" style="transform-origin:${cx}px ${baseY - 20}px">
      <line x1="${cx}" y1="${baseY - 20}" x2="${cx - 12}" y2="${baseY - 14}"/>
    </g>
    <g class="${on ? "type2" : ""}" style="transform-origin:${cx}px ${baseY - 20}px">
      <line x1="${cx}" y1="${baseY - 20}" x2="${cx - 13}" y2="${baseY - 12}"/>
    </g>
  </g>`;
}

function renderMap() {
  const g = selGame;
  const X0 = 90, X1 = 850, FH = 128, TOP = 120;
  const floorY = f => TOP + (5 - f) * FH;
  const short = (s, n) => (s && s.length > n ? s.slice(0, n - 1) + "…" : s || "");

  function room(id, label, x, y, w, sub) {
    const h = FH - 10;
    const s = nodeState(id, g);
    const c = NEON[id] || "#9aa8ff";
    const lit = s.active, done = /done|shipped/.test(s.text), blocked = s.text === "blocked";
    const edge = lit ? c : done ? "#39ffb6" : blocked ? "#ff3b5c" : "#2b3160";
    const sel = selNode === id ? 4 : 2;
    const cx = x + w / 2, deskY = y + h - 26;
    const msg = lit && g ? short(lastMsg(g, id), Math.floor(w / 7.2)) : "";
    const glowOn = lit || done || blocked;
    return `<g class="room ${lit ? "on" : ""}" onclick="pickNode('${id}')" style="cursor:pointer">
      <rect x="${x + 5}" y="${y + 6}" width="${w - 10}" height="${h}" rx="8" fill="${lit ? c : "#0a0d1f"}" fill-opacity="${lit ? 0.10 : 1}"
        stroke="${edge}" stroke-width="${sel}" ${glowOn ? 'filter="url(#neon)"' : ""} class="${lit ? "flick" : ""}"/>
      <line x1="${cx - 30}" y1="${deskY}" x2="${cx + 18}" y2="${deskY}" stroke="${glowOn ? edge : "#2b3160"}" stroke-width="2.5" filter="url(#neon)"/>
      <line x1="${cx - 26}" y1="${deskY}" x2="${cx - 26}" y2="${deskY + 18}" stroke="#2b3160" stroke-width="2"/>
      <line x1="${cx + 14}" y1="${deskY}" x2="${cx + 14}" y2="${deskY + 18}" stroke="#2b3160" stroke-width="2"/>
      <rect x="${cx - 22}" y="${deskY - 16}" width="18" height="12" rx="2" fill="${lit ? "#7ff9ff" : "#141a3a"}" stroke="${lit ? "#7ff9ff" : "#2b3160"}" ${lit ? 'filter="url(#neon)"' : ""}/>
      ${stick(cx + 8, deskY + 10, glowOn ? c : "#3a4277", lit)}
      <text x="${x + 14}" y="${y + 26}" font-family="Fredoka" font-size="15" font-weight="600" fill="${glowOn ? c : "#6b74a8"}" ${glowOn ? 'filter="url(#neon)"' : ""}>${label}</text>
      <text x="${x + 14}" y="${y + 42}" font-family="Inter" font-size="11" fill="${glowOn ? "#e8ebff" : "#4d5590"}">${esc(sub || s.text)}</text>
      ${msg ? `<rect x="${x + 12}" y="${y + 48}" width="${w - 24}" height="20" rx="10" fill="#0a0d1f" stroke="${c}" stroke-width="1.5" filter="url(#neon)"/>
        <text x="${x + 20}" y="${y + 62}" font-family="Inter" font-size="10.5" fill="#e8ebff">${esc(msg)}</text>` : ""}
    </g>`;
  }

  let rooms = "";
  rooms += room("manager", "MANAGER", X0, floorY(5), 380);
  rooms += room("checker", "QA LAB", X0 + 380, floorY(5), 380);
  ["R&D · GAMEPLAY", "R&D · ART", "R&D · UI", "R&D · AUDIO"].forEach((l, k) => { rooms += room("rnd", l, X0 + k * 190, floorY(4), 190); });
  rooms += room("ideas", "IDEAS STUDIO", X0, floorY(3), 460);
  rooms += room("charlie", "CHARLIE'S OFFICE", X0 + 460, floorY(3), 300, g ? (g.stage === "approval" ? "waiting for your OK!" : nodeState("charlie", g).text) : "idle");
  [["gameplay", "GAMEPLAY"], ["graphics", "GRAPHICS"], ["ui", "UI"], ["audio", "SOUND"], ["animation", "ANIMATION"]]
    .forEach(([id, l], k) => { rooms += room(id, l, X0 + k * 152, floorY(2), 152); });
  rooms += room("inspiration", "MAILROOM", X0, floorY(1), 250, "inspiration uploads");
  rooms += `<g><rect x="${X0 + 255}" y="${floorY(1) + 6}" width="250" height="${FH - 10}" rx="8" fill="#0a0d1f" stroke="#ff4dd8" stroke-width="2" filter="url(#neon)"/>
    <text x="${X0 + 380}" y="${floorY(1) + 50}" text-anchor="middle" font-family="Fredoka" font-size="22" font-weight="700" fill="#ff4dd8" filter="url(#neon)" class="flick">LOBBY</text>
    <rect x="${X0 + 355}" y="${floorY(1) + 62}" width="50" height="${FH - 66}" rx="3" fill="none" stroke="#2de2e6" stroke-width="2" filter="url(#neon)"/>
    <line x1="${X0 + 380}" y1="${floorY(1) + 62}" x2="${X0 + 380}" y2="${floorY(1) + FH - 4}" stroke="#2de2e6" stroke-width="1.5"/></g>`;
  rooms += room("done", "SHIPPING DOCK", X0 + 510, floorY(1), 250);

  const ef = g ? STAGE_FLOOR[g.stage] || 1 : 1;
  const elev = `<rect x="${X1 + 8}" y="${TOP}" width="52" height="${FH * 5}" rx="6" fill="#06081a" stroke="#2b3160" stroke-width="2"/>
    ${[1,2,3,4,5].map(f => `<text x="${X1 + 34}" y="${floorY(f) + 18}" text-anchor="middle" font-family="Fredoka" font-size="12" fill="${f === ef ? "#2de2e6" : "#2b3160"}" ${f === ef ? 'filter="url(#neon)"' : ""}>${f}</text>`).join("")}
    <g class="elev" style="transform: translateY(${floorY(ef) - TOP}px)">
      <rect x="${X1 + 14}" y="${TOP + 26}" width="40" height="${FH - 36}" rx="4" fill="#2de2e6" fill-opacity=".12" stroke="#2de2e6" stroke-width="2.5" filter="url(#neon)"/>
    </g>`;
  const floors = [5,4,3,2,1].map(f => `<line x1="${X0 - 6}" y1="${floorY(f) + FH - 2}" x2="${X1 + 6}" y2="${floorY(f) + FH - 2}" stroke="#2b3160" stroke-width="3"/>`).join("");
  const stars = Array.from({ length: 40 }, (_, i) => `<circle cx="${(i * 97) % 960}" cy="${(i * 53) % 110}" r="${i % 3 ? 1 : 1.6}" fill="#fff" opacity="${0.3 + (i % 5) / 10}"/>`).join("");
  const sign = `<rect x="${X0 + 170}" y="38" width="420" height="60" rx="14" fill="#0a0d1f" stroke="#ffb02e" stroke-width="3" filter="url(#neon)"/>
    <text x="${X0 + 380}" y="79" text-anchor="middle" font-family="Fredoka" font-size="30" font-weight="700" fill="#ffb02e" filter="url(#neon)" class="flick">CHIKEN STUDIOS</text>`;

  const H = TOP + FH * 5 + 50;
  document.getElementById("map").innerHTML = `
    <div class="row" style="justify-content:space-between;margin-bottom:6px">
      <h2 style="margin:0">${g ? esc(g.name) : "Chiken Studios HQ"}</h2>
      ${g ? `<span class="sub">${STAGE_LABEL[g.stage] || g.stage}</span>` : ""}
    </div>
    <svg viewBox="0 0 960 ${H}" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05061a"/><stop offset="1" stop-color="#1a0b3a"/></linearGradient>
        <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <rect width="960" height="${H}" fill="url(#night)" rx="14"/>${stars}
      <circle cx="880" cy="58" r="22" fill="#f4f1ff" opacity=".9" filter="url(#neon)"/>
      <rect x="${X0 - 14}" y="${TOP - 6}" width="${X1 - X0 + 28}" height="${FH * 5 + 8}" rx="10" fill="#0d1030" stroke="#c77dff" stroke-width="2" filter="url(#neon)"/>
      ${sign}${floors}${rooms}${elev}
      <line x1="0" y1="${TOP + FH * 5 + 6}" x2="960" y2="${TOP + FH * 5 + 6}" stroke="#ff4dd8" stroke-width="2" filter="url(#neon)"/>
    </svg>`;
}

function panelTabsFor(id, g) {
  const d = g?.docs || {}, n = g?.notes || {};
  switch (id) {
    case "rnd": return { "Research report": d["RESEARCH.md"] };
    case "ideas": return { "Game design (SPEC)": d["SPEC.md"], "From R&D": section(d["RESEARCH.md"], "For Ideas") };
    case "charlie": return { "Spec to approve": d["SPEC.md"], "Your TODO": d["README.md"] };
    case "gameplay": case "graphics": case "ui": case "audio": case "animation": return { [ROLES[id].label + " notes"]: n[id], "Hand-off from Ideas": section(d["SPEC.md"], { gameplay: "For Gameplay", graphics: "For Graphics", ui: "For UI", audio: "For Audio", animation: "For Animation" }[id]), "R&D refs": section(d["RESEARCH.md"], { gameplay: "For Gameplay", graphics: "For Graphics", ui: "For UI", audio: "For Audio", animation: "For Animation" }[id]) };
    case "manager": return { "Final checklist": d["SIGNOFF.md"], "Decisions": d["DECISIONS.md"], "Questions": d["QUESTIONS.md"] };
    case "checker": return { "Check report": d["CHECK_REPORT.md"] };
    case "done": return { "Game README": d["README.md"] };
    case "inspiration": return { "About": "Everything on the **Inspiration board** below is read by R&D and the Ideas lead before designing. R&D also adds links it finds online.\n\nUse the 📎 buttons to upload screenshots, sketches, or a `.txt` file with links." };
  }
  return {};
}
function section(src, name) {
  if (!src) return "";
  const m = src.split(/\n(?=## )/).find(s => s.startsWith("## " + name));
  return m || "";
}

function renderPanel() {
  const role = ROLES[selNode] || { label: "Inspiration", icon: "📎", color: "var(--dim)" };
  document.getElementById("panelTitle").innerHTML = `${role.icon} ${role.label}`;
  if (!selGame && selNode !== "inspiration") {
    document.getElementById("panelTabs").innerHTML = "";
    document.getElementById("panelDoc").innerHTML = '<p class="empty">Pick a game to see what this team member is working on.</p>';
    return;
  }
  const tabs = panelTabsFor(selNode, selGame);
  const names = Object.keys(tabs);
  if (!names.includes(selTab)) selTab = names[0];
  document.getElementById("panelTabs").innerHTML = names.map(t =>
    `<button class="tab ${t === selTab ? "on" : ""}" style="${t === selTab ? `background:${role.color}` : ""}" onclick="selTab='${t.replace(/'/g, "\\'")}';renderPanel()">${esc(t)}</button>`).join("");
  document.getElementById("panelDoc").innerHTML = md(tabs[selTab]);
}

function renderFeed() {
  const el = document.getElementById("feed");
  const log = (selGame?.log || []).slice().reverse();
  if (!log.length) { el.innerHTML = '<p class="empty">Messages between team members show up here.</p>'; return; }
  el.innerHTML = log.map(m => {
    const f = ROLES[m.from] || ROLES.system, t = ROLES[m.to] || ROLES.all;
    return `<div class="msg" style="border-left-color:${f.color}">
      <span class="t">${ago(m.time)}</span>
      <span class="who" style="color:${f.color}">${f.icon} ${f.label}</span>
      <span class="who" style="color:var(--dim)"> → ${t.label}</span>
      <p>${esc(m.text)}</p></div>`;
  }).join("");
}

function renderGallery() {
  const items = [...(selGame?.inspiration || []), ...DATA.inspiration];
  const el = document.getElementById("gallery");
  el.innerHTML = items.length ? items.map(i => i.kind === "image"
    ? `<div class="inspo"><img src="${i.url}" alt="${esc(i.name)}" onclick="zoom('${i.url}')"><div class="cap">${esc(i.name)}</div></div>`
    : `<div class="inspo"><pre>${esc(i.text || "📄")}</pre><div class="cap"><a href="${i.url}" target="_blank" style="color:var(--dim)">${esc(i.name)}</a></div></div>`
  ).join("") : '<p class="empty" style="grid-column:1/-1">No inspiration yet — upload screenshots, sketches, or a .txt of links.</p>';
  const up = `https://github.com/${REPO}/upload/main/` + (selGame ? `games/${selGame.slug}/inspiration` : "inspiration");
  document.getElementById("uploadGame").href = up;
  document.getElementById("uploadGame").style.display = selGame ? "" : "none";
}

function zoom(url) { document.getElementById("modalBody").innerHTML = `<img src="${url}">`; document.getElementById("modal").classList.add("on"); }
function showNew() {
  document.getElementById("modalBody").innerHTML = `<div class="box">
    <h2 style="color:var(--ideas)">💡 Start a new game</h2>
    <p>1. (Optional) <a href="https://github.com/${REPO}/upload/main/inspiration" target="_blank" style="color:var(--graphics)">Upload inspiration</a> first.</p>
    <p>2. Open <a href="https://claude.ai/code" target="_blank" style="color:var(--graphics)">Claude Code</a> on this repo and type:</p>
    <p><code>/new-game a tycoon where you grow clouds on sky islands</code></p>
    <p>3. Ideas writes the spec → you OK it → type <code>/build &lt;slug&gt;</code> and watch it move through the pipeline here.</p>
    <button class="btn" onclick="document.getElementById('modal').classList.remove('on')">Got it</button></div>`;
  document.getElementById("modal").classList.add("on");
}

function pick(slug) { selGame = DATA.games.find(g => g.slug === slug) || null; location.hash = slug; render(); }
function pickNode(id) { selNode = id; selTab = null; renderMap(); renderPanel(); }
function render() { renderGames(); renderMap(); renderPanel(); renderFeed(); renderGallery(); }

async function load() {
  try {
    const r = await fetch("data.json?t=" + Date.now());
    DATA = await r.json();
  } catch (e) { console.warn("no data.json", e); }
  const slug = location.hash.slice(1) || selGame?.slug;
  selGame = DATA.games.find(g => g.slug === slug) || DATA.games[0] || null;
  document.getElementById("updated").textContent = "refreshed " + new Date().toLocaleTimeString();
  render();
}
document.getElementById("uploadGlobal").href = `https://github.com/${REPO}/upload/main/inspiration`;
load();
setInterval(load, 60000);
</script>
</body>
</html>
